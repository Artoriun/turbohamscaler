# Keeps the demo instance from falling asleep.
#
# Render's free plan spins a service down after about fifteen minutes with no traffic, and the
# next visitor waits through a cold start on a black page carrying Render's logo rather than
# this app's. That page is what the README's demo link opened for anyone arriving after a quiet
# spell — the first impression of a project whose whole pitch is that it is already working.
#
# A request every ten minutes is enough to stay above that threshold.
#
# WHAT THIS COSTS. Nothing in Actions minutes: scheduled workflows on a public repository are
# free. It does spend Render's free allowance, which is 750 instance-hours a month against the
# ~730 in a month of always being awake — so this works while this is the only free web service
# on the account, and stops working the moment there is a second one. Delete this file, or drop
# the schedule to office hours, if that changes.
#
# GitHub also disables scheduled workflows on a repository with no activity for 60 days, and
# stops running them silently. If the demo is cold and this has not run, that is the first thing
# to check.

name: Keep the demo awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Nothing is read and nothing is written. The job only makes an outbound request.
permissions: {}

concurrency:
  group: keep-demo-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the demo
        run: |
          # --max-time 120 rather than the default: if it has already gone to sleep this
          # request is the cold start, and a cold start is exactly the slow thing being
          # avoided. Failing here would be reporting the problem as an error every time it
          # successfully fixed it.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
            https://turbohamscaler-demo.onrender.com/health || echo 000)
          echo "health answered $code"
          # Only a real refusal fails the job. A 5xx from a waking instance is normal; a
          # sustained one shows up as a run that fails every ten minutes, which is the signal
          # worth having.
          test "$code" = "200"
