name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The public pages are served from a project subpath, so the build needs to know it.
env:
  BASE_PATH: /turbohamscaler/

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      # Structural guards on tenant isolation. Run before the tests they back up: when both
      # fail, this one names the query, while a failing isolation test names a symptom.
      - name: Tenancy guards
        run: npm run check:tenancy

      - name: API tests
        run: npm run test:api

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Budgets
        run: npm run check:budgets

      - name: Install Playwright browser
        run: npx playwright install chromium

      # apt on a shared runner both fails and, less often, hangs holding a lock. A bare retry
      # loop only helps with the first: a hang never returns to be retried, and the job dies on
      # its own timeout with nothing useful in the log. `timeout` turns that into a retry too.
      - name: Install browser OS dependencies
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            timeout 180 npx playwright install-deps chromium && exit 0
            [ "$attempt" = 3 ] || echo "apt attempt $attempt failed or hung; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::npx playwright install-deps chromium failed three times"
          exit 1

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Run the suite against the built output
        run: npm run test:e2e:dist

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Only the public site. The app needs a server, and says so when it is served without one —
  # see NoApi in packages/web/src/pages/Portal.tsx.
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build for Pages
        run: npm run build
        env:
          VITE_BASE: ${{ env.BASE_PATH }}

      # A single-page app on a static host needs the 404 to be the app itself, or a deep link
      # like /turbohamscaler/app returns the host's own 404 and never boots the router.
      - name: SPA fallback
        run: cp packages/web/dist/index.html packages/web/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
