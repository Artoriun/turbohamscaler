name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The public pages are served from a project subpath, so the build needs to know it.
env:
  BASE_PATH: /turbohamscaler/

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      # Structural guards on tenant isolation. Run before the tests they back up: when both
      # fail, this one names the query, while a failing isolation test names a symptom.
      - name: Tenancy guards
        run: npm run check:tenancy

      - name: API tests
        run: npm run test:api

      - name: Unit tests
        run: npm run test:unit

      # The first command in the README's quick start, and nothing ran it — so `migrate` losing
      # its await during the async conversion broke a fresh clone's very first step, silently,
      # for as long as nobody tried it.
      - name: Seed a fresh database
        run: npm run db:reset

      # render.yaml's own commands, against a clean checkout, ending in a real sign-in. The
      # deploy path has broken twice in ways nothing else could see — missing migrations, and a
      # production install with no build tools — and both answered /health throughout.
      - name: The deploy blueprint actually works
        timeout-minutes: 12
        run: npm run check:deploy

      # The same suite on Postgres, which is what turns the Driver interface from an assertion
      # into a checked claim: SQLite and D1 share a dialect, so those two agreeing proved very
      # little. PGlite is Postgres compiled to WebAssembly, so this needs no service, no
      # container and no credentials.
      - name: API tests on Postgres
        run: npm run test:api:postgres

      # The same assertions against the Worker and a local D1, so "runs on both runtimes" is
      # something the build checks rather than something the README claims. Entirely local —
      # wrangler runs on Miniflare, so this needs no Cloudflare account.
      - name: API tests on Workers + D1
        run: npm run test:api:worker

      - name: Build
        run: npm run build

      - name: Budgets
        run: npm run check:budgets

      - name: Install Playwright browser
        run: npx playwright install chromium

      # apt on a shared runner both fails and, less often, hangs holding a lock. A bare retry
      # loop only helps with the first: a hang never returns to be retried, and the job dies on
      # its own timeout with nothing useful in the log. `timeout` turns that into a retry too.
      - name: Install browser OS dependencies
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            timeout 180 npx playwright install-deps chromium && exit 0
            [ "$attempt" = 3 ] || echo "apt attempt $attempt failed or hung; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::npx playwright install-deps chromium failed three times"
          exit 1

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Run the suite against the built output
        run: npm run test:e2e:dist

      # Accessibility, SEO, best-practices and CLS are gated; performance is printed but not,
      # because a shared runner's timings drift more than the thing being measured. Uses the
      # Chromium already installed above rather than provisioning a second browser.
      - name: Lighthouse
        run: npm run prerender && npm run check:lighthouse

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Only the public site. The app needs a server, and says so when it is served without one —
  # see NoApi in packages/web/src/pages/Portal.tsx.
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Prerendering boots the built app in a real browser, so this job needs one too — the
      # checks job installing it does nothing for a job running on its own runner. --only-shell:
      # this job navigates and reads the DOM, the same as render.yaml's build — no screenshot,
      # no trace, nothing the full browser has and the shell does not.
      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      # Builds, then writes each public route out with its text already in the markup, plus
      # 404.html and a file for every known route. Without those files every route but the root
      # answers with a 404 *status* while rendering correctly — invisible to a person, and
      # exactly what a crawler records.
      - name: Build and prerender for Pages
        run: npm run prerender
        env:
          VITE_BASE: ${{ env.BASE_PATH }}
          # Origin only — the path comes from the build's own base. See scripts/prerender.mjs.
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
