<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TurboHamscaler</title>
    <!-- Named explicitly rather than relying on the browser's guess. Without a link the
         browser asks the origin root for /favicon.ico, which under a project subpath is not
         this site at all — it 404s, and that failure is logged to the console. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="A TurboRepo starter for a multi-tenant web app." />
  </head>
  <body>
    <script>
      // Before first paint, so an explicit choice never flashes the other theme on the way in.
      // Mirrors packages/web/src/lib/theme.ts — keep the two in step.
      (() => {
        try {
          if (localStorage.getItem('theme') === 'dark')
            document.documentElement.classList.add('dark-mode');
        } catch {
          /* Private mode can refuse localStorage; following the OS is a fine fallback. */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
