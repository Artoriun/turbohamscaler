<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TurboHamscaler</title>
    <!-- Named explicitly rather than relying on the browser's guess. Without a link the
         browser asks the origin root for /favicon.ico, which under a project subpath is not
         this site at all — it 404s, and that failure is logged to the console. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="A TurboRepo starter for a multi-tenant web app: accounts, organisations, roles and per-tenant data, with the isolation checks that keep them honest."
    />

    <!-- What a link to this looks like when somebody shares it. Without these it is a bare URL
         with no title, no summary and no picture, which is most of what decides whether anyone
         clicks it.

         The URLs here are relative, and Vite rewrites them against the build's base. They have
         to be absolute to work — a crawler has no page to resolve them against — so the
         prerenderer rewrites them again with the real origin. That is also why it is the
         prerenderer's job rather than a constant: the same build is served from GitHub Pages
         under a subpath and from the demo host at a root. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TurboHamscaler" />
    <meta property="og:title" content="TurboHamscaler — the boring half of a multi-tenant app" />
    <meta
      property="og:description"
      content="Accounts, organisations, roles and per-tenant data, with the isolation checks that keep them honest. Clone it and start on the part that is actually yours."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TurboHamscaler's landing page beside its pixel hamster mascot" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      // Before first paint, so an explicit choice never flashes the other theme on the way in.
      // Mirrors packages/web/src/lib/theme.ts — keep the two in step.
      (() => {
        try {
          if (localStorage.getItem('theme') === 'dark')
            document.documentElement.classList.add('dark-mode');
        } catch {
          /* Private mode can refuse localStorage; following the OS is a fine fallback. */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
