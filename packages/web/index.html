<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TurboHamscaler</title>
    <meta name="description" content="A TurboRepo starter for a multi-tenant web app." />
  </head>
  <body>
    <script>
      // Before first paint, so an explicit choice never flashes the other theme on the way in.
      // Mirrors packages/web/src/lib/theme.ts — keep the two in step.
      (() => {
        try {
          if (localStorage.getItem('theme') === 'dark')
            document.documentElement.classList.add('dark-mode');
        } catch {
          /* Private mode can refuse localStorage; following the OS is a fine fallback. */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
