# Render Blueprint: the whole app on one free instance.
#
# One service serves both halves, and that is not a shortcut — it is the only arrangement that
# works. The session cookie is SameSite=Lax, so a browser will not send it on a cross-*site*
# request: pages on one host and the API on another means nobody can sign in, however the URLs
# are configured. One origin, and the cookie is simply same-site. See packages/api/src/index.ts,
# which serves the built front end when it finds one.
#
# The Cloudflare Workers equivalent is wrangler.toml. The same code runs on both — Hono routes,
# a Driver interface for the database, Web Crypto for hashing — so this is a choice, not a
# commitment. Workers needs the paid plan, because its free tier allows 10ms of CPU per request
# and hashing a password properly costs more than that. This costs nothing.
#
# WHAT FREE MEANS HERE. The instance sleeps when idle, so the first request after a quiet spell
# waits for a cold start. There is no persistent disk, so the SQLite file is gone on every
# restart — which is why DEMO_SEED is on: the database rebuilds itself with the two demo
# organisations each time. That makes a fine demo and an unacceptable production database. For
# anything real, attach a disk or point DATABASE_URL at a hosted one and turn DEMO_SEED off.
#
# NODE VERSION. packages/shared ships raw TypeScript, so the runtime has to strip types on load.
# Node 22 does; Node 20 dies on `Unexpected token 'export'` pointing at a file that looks fine.

services:
  - type: web
    name: turbohamscaler-demo
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    # Both halves: the web build is what the API then serves.
    # --include=dev is not optional: NODE_ENV=production makes npm set omit=dev, and turbo,
    # typescript and vite are all devDependencies — without it the build has no build tools and
    # fails before it starts. Render sets NODE_ENV for a Node service whether or not the block
    # below does, so this has to be explicit rather than achieved by leaving NODE_ENV unset.
    #
    # `prerender` rather than `build`: it runs the build and then writes each public route out
    # with its text already in the markup. Without it the deploy served a 1.4KB shell with no
    # words in it, /sitemap.xml answered with that same shell because no sitemap had been
    # generated, and every made-up URL returned 200 because a single-file build cannot tell a
    # real route from a typo. The README claims prerendered pages; this is what makes that true
    # of the deployment it links to, rather than only of the Pages build.
    #
    # It costs a Chromium download at build time, which is the price of rendering the pages with
    # the same browser the tests use rather than maintaining a second way to produce HTML.
    # `build` then `prerender`, both: prerender builds only the web workspace, so on its own it
    # leaves the API with no dist and the start command with nothing to run.
    buildCommand: npm ci --include=dev && npx playwright install chromium && npm run build && npm run prerender
    startCommand: node packages/api/dist/index.js
    # /health answers without touching the database, so a failing check means the process is
    # down rather than the schema being mid-migration.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Render injects PORT and expects the process to bind it; index.ts reads it first.
      - key: NODE_ENV
        value: production
      # Ephemeral on the free plan — see the note above before trusting it with anything.
      - key: DATABASE_URL
        value: /tmp/hamscaler.db
      # Rebuilds the demo organisations on each cold start, since the disk does not survive one.
      # Leave this unset anywhere real: it creates accounts nobody asked for.
      - key: DEMO_SEED
        value: 'true'
